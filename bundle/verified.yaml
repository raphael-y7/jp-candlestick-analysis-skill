schema_version: 1
bundle_id: bundle.jp-candlestick-analysis-skill
book:
  title: 日本蜡烛图技术（第二版+新解）合并蒸馏
  author: '[美] 史蒂夫·尼森（丁圣元 译）'
  source_pack: 转写稿+视觉转写合并稿
entry:
  name: jp-candlestick-analysis-skill
  description: 当需要解读A股个股或场外基金净值的K线/收盘价序列时使用：识别单根与组合蜡烛图形态并验证真伪，按趋势方向与位置过滤信号，用成交量、均线、摆动指数、窗口、支撑阻挡等异源工具相互验证，测算百分比回撤与价格目标，计算止损与风险报偿比，最终给出买入/减仓/观望/放弃的可检查结论；也可绘制三线反向突破图、砖形图、钥匙图判定趋势方向与平仓时机（场外基金净值唯一图形方案）。核心价值：把“见形态就下结论”升级为“语义校准
    → 位置过滤 → 相互验证 → 先算后做”的四步决策流程，封堵未验证即行动、单形态决策、假突破追单、超买当指令、跳空必回补等高频错误。
  core_principles:
  - 反转形态 = “趋势变化”信号：只宣告原趋势终止，方向须等后续证据（可能反转/转横/继续）；禁止单形态决策。
  - 位置比形态重要：先问趋势方向一致性、支撑/阻挡、超买超卖环境，再解读形态；逆主要趋势的信号只用于减仓保护，不用于开新仓。
  - 收市价是确认之锚：形态完成、突破有效、窗口封闭、新价图反转一律以收市价为准；上吊线/倒锤子线等必须次日验证。
  - 相互验证才行动：同一价位出现一群异源信号（蜡烛图×西方工具×成交量）才值得行动；同源指标堆叠（RSI+KDJ+MACD）不增加信息量。
  - 每个信号自带止损与失效价：入场前先算风险报偿比，不划算就放弃；收市到达证伪价即改判离场。
  - 蜡烛图不提供价格目标：目标由支撑阻挡、回撤位、箱体/对等运动/旗形/三角形测算，且只用于平仓、不用于开新仓。
  - 所有数字判据是参考标杆：下影线倍数、8–10 个新高、差异指数 ±10%、均线参数等须按标的自测并声明；本方法为案例与经验归纳，无统计回测背书。
  out_of_scope:
  - 期权类建议（备兑/保护性期权为美国市场工具，A股多数标的无对等物）。
  - 期货/外汇专属技法与 T+0 盘中试仓-收盘确认打法（A股 T+1 下未经验证的变形不提供）。
  - 基本面与消息面分析（消息只按“市场对该消息的反应”核对，不做消息真伪与业绩判断）。
  - 任何统计显著性承诺：不提供命中率、超额收益或回测背书。
  stop_conditions:
  - 数据门不过：开盘价被前收盘冒充（无真实开盘价）→ 停止形态判读，要求更换数据源（高开低开信号已丢失）。
  - 无趋势可反转：横盘箱体中部的十字线/小实体群等 → 直接输出“信号无意义，不动作”并停止该信号的解读。
  - 证伪触发：收市价越过预登记的证伪价/止损价 → 停止原判断，输出改判/离场结论，不寻找继续持有的理由。
  - 风险报偿比不划算且无更优入场位 → 判停为“放弃交易”，不为该信号继续寻找买入理由。
  - 用户索要期权策略或 T+0 技法 → 声明超出范围并停止。
router_entry:
  name: jp-candlestick-analysis-skill-router
  description: cangjie 来源路由入口（compact pack 视图）：把K线/蜡烛图相关的用户意图路由到本 Bundle 的 27 个规范能力（C01–C27），其中 5 个已晋级为独立 Skill（stop-reward-risk-skill、price-target-retracement-skill、window-gap-management-skill、support-resistance-system-skill、kagi-chart-skill），其余由
    jp-candlestick-analysis-skill 入口在内部调用能力卡承接；本入口同时承载消息反应与资料采信（参考级单元 C27）的全局警示叙述与纪律检查项。single 模式安装时仅发布 jp-candlestick-analysis-skill 一个入口。
promotion_budget: 8
capabilities:
- capability_id: cap.jp-candlestick-analysis-skill.signal-context-filter
  revision: 1
  status: active
  slug: signal-context-filter
  title: 位置背景过滤与信号取舍决策流程
  importance: critical
  importance_rationale: task-06。漏用后果=把任何形态当买卖指令，直接制造 x01"见形态就喊单"与 x02"诱人的陷阱"两类最高频亏损路径；是全书最高频强调的总闸门（阶段 0 优先级第 3）。
  one_liner: 形态的位置比形态本身更重要——先确认有趋势可反转，再过位置四要素；顺主要趋势才开新仓，逆向信号只用于减仓保护。
  intents:
  - 判断某个K线形态出现在这个位置该不该按它操作
  - 逆主要趋势的看涨/看跌信号应该怎么处理
  - 为什么形态很标准却不值得交易（位置与报偿比倒挂）
  - 复盘某个形态信号失效的原因
  keywords:
  - 位置过滤
  - 位置比形态重要
  - 信号取舍
  - 趋势方向一致性
  - 支撑阻挡环境
  - 超买超卖
  - signal context
  - location over pattern
  card: cards/signal-context-filter-skill.md
  also_read:
  - two-line-reversal
  - star-family
  - umbrella-line-family
  - signal-confluence
  - stop-reward-risk-skill
  - price-target-retracement-skill
  frontmatter:
    description: '当用户问"某个K线形态能不能按它操作/该买该卖"时使用：位置过滤四步决策树——语义校准（反转=趋势变化信号，非反向行情）→确认先前趋势（横盘箱体中部信号无意义，判停）→位置四要素（趋势一致性/支撑阻挡/超买超卖/信号群密度）→方向分派（顺主要趋势才开新仓，逆向只减仓保护）→先算风险报偿比再行动。适用于"形态位置对不对""逆势信号怎么处理""为什么标准形态不值得交易"等问句（signal
      context, location over pattern）。不适用于：形态判据本身的核对（用对应形态卡）、目标价测算、信号群清点计数。触发词：位置比形态重要、位置过滤、该不该按形态操作。

      '
    tags:
    - decision
    - framework
    - candlestick
  source_evidence:
  - source_id: candlestick
    location: 上书第四章引言（L553-555）、第七章图7.28、第九章图9.1；下书第4章（L5332）
  promotion:
    destination: router
    gate:
      independent_intent: false
      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 位置过滤总是与形态/信号请求同请求触发，promoted 必与路由入口双触发；作为入口四步流程的载体保留
- capability_id: cap.jp-candlestick-analysis-skill.data-quality-confirmation-gate
  revision: 1
  status: active
  slug: data-quality-confirmation-gate
  title: 蜡烛图数据质量与确认口径门
  importance: high
  importance_rationale: task-01。漏用后果=用前收盘冒充开盘丢失高开低开信号（A股高开低开频发）、盘中假突破当真突破、两版判据混用导致口径漂移；一切后续分析的前置门。
  one_liner: 一切形态判读前先过三查——真实开盘价、收市价确认锚（盘中穿越不算）、判据版本选一版记录并全程一致。
  intents:
  - 检查行情软件K线数据能不能用于形态判读
  - 盘中破位/突破到底算不算数
  - 两本书定义冲突时选哪一版
  - 声明本轮分析的确认口径与判据版本
  keywords:
  - 数据质量
  - 真实开盘价
  - 收市价确认
  - 判据版本
  - 盘中突破无效
  - 周线收盘
  - data quality
  - closing price confirmation
  card: cards/data-quality-confirmation-gate-skill.md
  also_read:
  - single-candle-reading
  - window-gap-management-skill
  - three-line-break-chart
  frontmatter:
    description: '在开始任何K线形态判读之前，或用户怀疑数据/口径时使用：三查门——①数据口径自查（开盘价若恒等于前收盘=高开低开信息丢失，判停换源）；②确认口径声明（形态完成、突破有效、窗口封闭一律以收市价为准，盘中穿越不算，周线按周五收盘）；③判据分歧处理（两书定义并存时"准确率更高者优先"，选一版+记录+全程一致；A股乌云盖顶等取股票宽版并声明）。适用问句："盘中破了算不算""软件开盘价和昨天收盘一样""两个定义听哪个"。不适用于：具体形态判定与多空结论（那是各形态卡的职责）。触发词：真实开盘价、收市价确认、判据版本、data
      quality。

      '
    tags:
    - procedure
    - data-gate
    - candlestick
  source_evidence:
  - source_id: candlestick
    location: 下书第2章（L4122）；上书第一章（L325-327）、第七章（L2709）
  promotion:
    destination: router
    gate:
      independent_intent: false
      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 前置数据门无人单独请求；作为入口第 0 步与各能力卡的公共口径
- capability_id: cap.jp-candlestick-analysis-skill.single-candle-reading
  revision: 1
  status: active
  slug: single-candle-reading
  title: 单根K线状态读数与开盘先行判据
  importance: high
  importance_rationale: task-01/02。漏用后果=基础读数失准（长实体误判、动量衰减漏看、高浪线方向感丧失漏读），后续一切形态判读失去阈值口径与价位登记源。
  one_liner: 长实体（≥前日实体3倍）读控制权、影线读环境拒绝、实体中点与底顶登记价位带、次日开盘相对前实体中点验短期强弱。
  intents:
  - 解读单根大阳线/大阴线/长影线的含义
  - 高开低开预示什么（开盘先行法）
  - 光脚阳线/光头阴线（捉腰带线）怎么看及其失效
  - 把单根K线的支撑阻力带登记进价位表
  keywords:
  - 长实体
  - 纺锤线
  - 捉腰带线
  - 高浪线
  - 开盘先行
  - 动量衰减
  - long body
  - belt-hold
  card: cards/single-candle-reading-skill.md
  also_read:
  - volume-confirmation
  - doji-context
  - divergence-index
  - data-quality-confirmation-gate
  frontmatter:
    description: '当用户问单根K线含义时使用：长实体判定（≥前一天3倍）→影线环境判读（长上影在高价区/阻力区才重视、长下影在支撑区=空头失控、高浪线=丧失方向感）→价位登记（长实体中点=支撑阻力带、底=支撑、顶=阻力）→开盘先行（次日开市价 vs 前实体中点：开在长白实体中点以下=空头警讯，A股过滤集合竞价噪声）→动量衰减（长实体后小实体序列=供需重新均衡）。适用："大阳线/长上影说明什么""高开低开怎么看""光脚阳线是什么信号"。不适用于：开≈收的十字线（用
      doji-context）、成交量核对（用 volume-confirmation）。触发词：长实体、捉腰带线、开盘先行、动量衰减。

      '
    tags:
    - procedure
    - reading
    - candlestick
  source_evidence:
  - source_id: candlestick
    location: 下书第2章（L4140-4301、L4433）；上书第三章图3.1-3.8、第六章（L1243-1261）
  promotion:
    destination: router
    gate:
      independent_intent: true
      independent_contract: true
      independent_run: false
      independent_reuse: true
      independent_eval: true
    notes: 单根读数可单独提出，但'读对形态≠读对含义'，正确执行必须位置/量环境（判 3 不通过）；是入口默认第一层
- capability_id: cap.jp-candlestick-analysis-skill.volume-confirmation
  revision: 1
  status: active
  slug: volume-confirmation
  title: 交易量验证清单与积聚/派发矩阵
  importance: high
  importance_rationale: task-02/17。漏用后果=把高位放量滞涨当洗盘追高、量缩新高继续追涨；A股量价文化下高频错误；量是所有信号的可信度加权器。
  one_liner: 量只做相对比较——先核形态的理想量分布给信号加权，再按"低价区放量呆滞=积聚、高价区放量停滞=派发"定位；量缩新高只减分不定罪。
  intents:
  - 高位放量滞涨是不是出货（派发判读）
  - 低位放量抗跌/不涨是不是吸筹（积聚判读）
  - 创新高但缩量健康吗
  - 核对某个形态的量能配合是否合格
  keywords:
  - 成交量验证
  - 放量缩量
  - 积聚派发
  - 吸筹出货
  - 巨量锤子线
  - 量价背离
  - volume confirmation
  - accumulation distribution
  card: cards/volume-confirmation-skill.md
  also_read:
  - single-candle-reading
  - signal-confluence
  - divergence-index
  frontmatter:
    description: '当用户问成交量与价格的关系时使用：相对量原则（只看相对增减与井喷，不用绝对量；基准窗口如近20日均量须自定声明）→理想量分布核对（刺透=黑轻白重、看跌吞没=白轻黑重、上升三法首末量最大、巨量窗口更坚实）→特判（巨量锤子线可更积极收市买进；创新高量缩=警讯但仅减分不定罪）→积聚/派发矩阵（低价区+放量+呆滞=积聚看涨；高价区+放量+停滞=派发看跌）。适用："高位放量滞涨是不是出货""低位放量抗跌是不是吸筹""缩量创新高健康吗"。不适用于：无成交量数据、把量当独立买卖信号。触发词：放量、缩量、积聚、派发、量价背离、volume
      confirmation。

      '
    tags:
    - procedure
    - volume
    - candlestick
  source_evidence:
  - source_id: candlestick
    location: 上书第十五章（L2801-2859，图15.1-15.6）；下书第2章（L4336，图2-33/2-34）
  promotion:
    destination: router
    gate: &id001
      independent_intent: true
      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 五判据全过，预算排序第 6；'高位放量滞涨是不是出货'问句支持其为 split-on-evidence 首位候补
- capability_id: cap.jp-candlestick-analysis-skill.umbrella-line-family
  revision: 1
  status: active
  slug: umbrella-line-family
  title: 伞形线族判定、验证与交易执行
  importance: high
  importance_rationale: task-03。漏用后果=上吊线/倒锤子线未验证即行动（书内点名的头号错误之一，图4.12三根上吊线反例）；判据弹性不声明导致同类形态忽认忽不认。
  one_liner: 小实体居上端+长下影按先前趋势定名（跌后锤子线看涨、涨后上吊线看跌）；上吊线/倒锤子线必须次日收市越过实体才生效；锤子线止损在其低点下方（收市价口径）。
  intents:
  - 长下影线是锤子线吗、能抄底吗
  - 高位吊颈线/上吊线要不要跑
  - 流星线/倒锤子线怎么处理（含验证要求）
  - 伞形线出现后的试仓/加码/止损计划
  keywords:
  - 锤子线
  - 上吊线
  - 流星线
  - 倒锤子线
  - 次日验证
  - 伞形线
  - hammer
  - hanging man
  card: cards/umbrella-line-family-skill.md
  also_read:
  - signal-context-filter
  - data-quality-confirmation-gate
  - stop-reward-risk-skill
  - nonstandard-synthetic-candle
  frontmatter:
    description: '当用户问锤子线/上吊线/流星线/倒锤子线等长影线单根形态时使用：形状三判据（实体居上端、下影线达实体[2,3]倍区间并声明自测值、无/极短上影）→按先前趋势定名（跌后=锤子线看涨、涨后=上吊线看跌；镜像为倒锤子/流星）→验证分叉（锤子/流星无须强制验证；上吊线/倒锤子必须次日开市尤其收市价越过实体才生效，未验证=观望）→执行（试仓→回抽加码→止损=收市跌破锤子线低点；A股T+1变形为试仓过夜次日确认）。适用："长下影线能抄底吗""吊颈线要不要跑"。不适用于：位置是否值得行动（signal-context-filter）、双线/三根形态。触发词：锤子线、上吊线、流星线、验证。

      '
    tags:
    - procedure
    - pattern
    - candlestick
  source_evidence:
  - source_id: candlestick
    location: 上书第四章（L583-639，图4.4-4.12）、第五章（L1057-1085）；下书第3章（L4468，图3-1~3-16）
  promotion:
    destination: router
    gate:
      independent_intent: true
      independent_contract: true
      independent_run: false
      independent_reuse: true
      independent_eval: true
    notes: 形态族：单独触发意义弱——实际使用总是伴随位置过滤（C01）与次日验证（判 3 不通过）
- capability_id: cap.jp-candlestick-analysis-skill.two-line-reversal
  revision: 1
  status: active
  slug: two-line-reversal
  title: 双线反转形态判定（含强度分级与两市场口径）
  importance: high
  importance_rationale: task-04。漏用后果=判据不成立仍按形态行动（x06）、失效价不登记（收市上穿形态高点不减仓）；强度分级与口径漂移导致信号评价失据。
  one_liner: 吞没须实体覆盖+颜色相反+先前趋势；乌云盖顶未过中点不算完成（刺透必须过中点）；收市上穿形态高点=信号失效，形态高低点登记为阻力/支撑。
  intents:
