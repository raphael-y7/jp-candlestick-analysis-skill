    description: '用户同时使用新价图（三线图/砖形图/钥匙图）与蜡烛图、问两者怎么配合，或问"现在是牛是熊、何时买卖"，或抱怨新价图信号太晚时使用。分工流水线：①新价图定宏观方向（连续白线=牛、黑转向线=方向警报；黑白相间=无趋势判停）→②蜡烛图只在判定方向内找时机（多头方向下空头信号仅平仓保护、绝不开反向仓；熊市镜像，A股落地为减仓/离场执行点）→③转向线/阴阳转换作平仓触发→④黑转向线出现即停买复核。必须声明滞后预期：方向归新价图、时点归蜡烛图，抓主段不逃顶不抓底。触发词：宏观定向微观择时、新价图、工具分工、signal
      lag、怎么配合。不适用于：单图画法请求（走对应画图卡）、均线定方向（均线验证卡）。

