  frontmatter:
    description: '参考级单元。用户拿利好/利空消息问该不该据此买卖，观察到"该涨不涨/该跌不跌"，或问某说法可信吗、传闻股要不要跟时使用。可执行流程：不依消息立即交易 → 观察 1~3 个时段的市场反应 → 利好不涨=绷紧警惕之弦（看跌线索）；利空不跌=反向线索 → 登记利好日低点为利空试探位、收市跌破即信号确认。采信元规则：说法须两个独立来源证实（作者自承三星形态破例，单一来源采信度最低）、远离传言个股、书中数字（三个窗口、8~10
      个新高、±10% 等）一律为待自测参数。输出仅为警惕级结论，非方向指令。不适用于：消息真伪与业绩解读、基本面分析；方向指令仍须蜡烛图信号确认。

      '
